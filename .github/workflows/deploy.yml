name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Build happens here on GitHub's runner (7GB RAM) — not on your server
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_GOOGLE_MAP_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_CLIENT_HOST_URL: ${{ secrets.NEXT_CLIENT_HOST_URL }}
          NEXT_PUBLIC_SITE_VERSION: ${{ secrets.NEXT_PUBLIC_SITE_VERSION }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Pull latest code + install deps while server is still running (no downtime)
      - name: Update server code
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -lc "'
            set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            cd /var/www/vhosts/zipsy.co.uk/httpdocs
            git pull origin main
            yarn install --frozen-lockfile
          '"

      # Transfer the built .next folder to a staging location (server still running)
      - name: Transfer build artifacts
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            .next/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/vhosts/zipsy.co.uk/httpdocs/.next_new/

      # Only this step causes downtime (~5 seconds)
      - name: Swap build and restart
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -lc "'
            set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            cd /var/www/vhosts/zipsy.co.uk/httpdocs
            pm2 stop \"6ammart-web-next-js-dev\" || true
            rm -rf .next_old
            mv .next .next_old 2>/dev/null || true
            mv .next_new .next
            pm2 start \"6ammart-web-next-js-dev\" || pm2 start server.js --name \"6ammart-web-next-js-dev\"
            pm2 save
            rm -rf .next_old
          '"
